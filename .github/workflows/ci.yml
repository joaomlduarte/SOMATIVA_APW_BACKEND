name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# Permissão mínima: o token do workflow só pode ler o código
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: chave-usada-somente-no-ci
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar o projeto
        run: python manage.py check

      - name: Testes unitários
        run: python manage.py test
